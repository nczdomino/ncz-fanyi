name: tests

# The dictionary ranking engine and the API hardening both regressed silently before.
# This workflow is the safety net: every push and PR must pass the full suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The project has no runtime dependencies, so there is nothing to install.
      - name: Dictionary ranking engine + render smoke test
        run: npm run test:dict

      - name: API hardening (CORS, rate limits, payload caps)
        run: node test_api_security.mjs

      - name: Offline layer (service worker)
        run: node test_sw.js

      - name: Extended dictionary (CC-CEDICT build + ranking)
        run: node test_ext_dict.js

      - name: Speech pipeline (chunking, engine choice, audio cache)
        run: node test_audio_core.js

      - name: Legacy suites
        run: |
          node test_dict_search.js
          node test_hsk789_and_live_dict.js
          node test_ocr.js
          node test_handwriting.js

      - name: Serverless handlers must parse as ES modules
        run: |
          node --input-type=module -e "import('./api/translate.js').then(m => { if (typeof m.default !== 'function') process.exit(1); })"
          node --input-type=module -e "import('./functions/_lib/http.js').then(m => { if (typeof m.jsonCorsHeaders !== 'function') process.exit(1); })"
